name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.2.0)'
        required: true
        default: '0.1.0'

env:
  APP_NAME: harbour-gitwatch
  SFOS_RELEASE: '5.0.0.76'

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tarball: ${{ steps.create-tarball.outputs.tarball }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.1.0"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Update version in files
        working-directory: harbour-gitwatch
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          sed -i "s/^Version: .*/Version: ${VERSION}/" rpm/harbour-gitwatch.spec
          sed -i "s/^Version: .*/Version: ${VERSION}/" rpm/harbour-gitwatch.yaml
          sed -i "s/^VERSION=\".*\"/VERSION=\"${VERSION}\"/" build.sh
          echo "Updated version to ${VERSION}"

      - name: Run tests before release
        working-directory: harbour-gitwatch
        run: |
          pip install pytest pytest-mock
          python -m pytest tests/ -v --tb=short

      - name: Create source tarball
        id: create-tarball
        working-directory: harbour-gitwatch
        run: |
          chmod +x build.sh
          ./build.sh
          TARBALL=$(ls harbour-gitwatch-*.tar.bz2)
          echo "tarball=${TARBALL}" >> $GITHUB_OUTPUT
          echo "Created: ${TARBALL}"

  build-rpms:
    name: Build RPMs
    runs-on: ubuntu-latest
    needs: prepare-release
    strategy:
      matrix:
        arch: [aarch64, armv7hl, i486]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update version
        working-directory: harbour-gitwatch
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          sed -i "s/^Version: .*/Version: ${VERSION}/" rpm/harbour-gitwatch.spec
          sed -i "s/^Version: .*/Version: ${VERSION}/" rpm/harbour-gitwatch.yaml

      - name: Build RPM for ${{ matrix.arch }}
        uses: coderus/github-sfos-build@sfos5
        with:
          release: ${{ env.SFOS_RELEASE }}
          arch: ${{ matrix.arch }}

      - name: Rename RPM with version
        run: |
          mkdir -p dist
          for rpm in RPMS/*.rpm; do
            if [ -f "$rpm" ]; then
              VERSION="${{ needs.prepare-release.outputs.version }}"
              newname="dist/harbour-gitwatch-${VERSION}-${{ matrix.arch }}.rpm"
              mv "$rpm" "$newname"
              echo "Renamed: $rpm -> $newname"
            fi
          done
          ls -lh dist/

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: dist/*.rpm
          retention-days: 90

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-rpms]
    permissions:
      contents: write
    steps:
      - name: Download source tarball
        uses: actions/download-artifact@v4
        with:
          name: release-tarball
          path: dist/
        if: false

      - name: Download all RPMs
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: rpm-*
          merge-multiple: true

      - name: Create source tarball
        working-directory: harbour-gitwatch
        run: |
          chmod +x build.sh
          VERSION="${{ needs.prepare-release.outputs.version }}"
          sed -i "s/^VERSION=\".*\"/VERSION=\"${VERSION}\"/" build.sh
          ./build.sh
          cp harbour-gitwatch-*.tar.bz2 ../../dist/

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          cat > release-notes.md <<EOF
          ## harbour-gitwatch v${VERSION}

          GitHub Activity Notifier for Sailfish OS (Jolla Phone 2026)

          ### Features
          - Monitor GitHub users for activity (pushes, PRs, issues, releases)
          - Background checks every 30 minutes via systemd timer
          - System notifications for new activity
          - Add/remove watched users
          - Danish language UI

          ### Installation
          Download the RPM for your device architecture and install:
          \`\`\`bash
          pkcon install-local harbour-gitwatch-${VERSION}-aarch64.rpm
          \`\`\`

          Or see [INSTALL.md](https://github.com/storefyr/Sko-a/blob/main/harbour-gitwatch/INSTALL.md) for detailed instructions.

          ### Requirements
          - Sailfish OS 5.x (Jolla Phone 2026)
          - pyotherside-qml-plugin-python3-qt5
          - python3-base

          ### Files
          - \`harbour-gitwatch-${VERSION}-aarch64.rpm\` - For Jolla Phone 2026 (ARM64)
          - \`harbour-gitwatch-${VERSION}-armv7hl.rpm\` - For 32-bit ARM devices
          - \`harbour-gitwatch-${VERSION}-i486.rpm\` - For emulator (x86)
          - \`harbour-gitwatch-${VERSION}.tar.bz2\` - Source tarball

          ### License
          GPL-3.0 - see [LICENSE](https://github.com/storefyr/Sko-a/blob/main/LICENSE)
          EOF
          echo "notes-file=release-notes.md" >> $GITHUB_OUTPUT

      - name: List release assets
        run: |
          echo "Release assets:"
          ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-release.outputs.version }}
          name: harbour-gitwatch v${{ needs.prepare-release.outputs.version }}
          body_path: ${{ steps.notes.outputs.notes-file }}
          files: |
            dist/harbour-gitwatch-*.rpm
            dist/harbour-gitwatch-*.tar.bz2
          draft: false
          prerelease: false
