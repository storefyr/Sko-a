name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.2.0)'
        required: true
        default: '0.1.0'

env:
  APP_NAME: harbour-gitwatch
  SFOS_VERSION: '5.0.0.43'

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.1.0"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Update version in files
        working-directory: harbour-gitwatch
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          sed -i "s/^Version: .*/Version: ${VERSION}/" rpm/harbour-gitwatch.spec
          sed -i "s/^VERSION=\".*\"/VERSION=\"${VERSION}\"/" build.sh
          echo "Updated version to ${VERSION}"

      - name: Run tests before release
        working-directory: harbour-gitwatch
        run: |
          pip install pytest pytest-mock
          python -m pytest tests/ -v --tb=short

  build-rpms:
    name: Build RPM (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: prepare-release
    strategy:
      matrix:
        arch: [aarch64, armv7hl, i486]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y bzip2

      - name: Update version
        working-directory: harbour-gitwatch
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          sed -i "s/^Version: .*/Version: ${VERSION}/" rpm/harbour-gitwatch.spec
          sed -i "s/^VERSION=\".*\"/VERSION=\"${VERSION}\"/" build.sh

      - name: Build source tarball
        working-directory: harbour-gitwatch
        run: |
          chmod +x build.sh
          ./build.sh
          ls -la *.tar.bz2

      - name: Build RPM with Sailfish SDK
        working-directory: harbour-gitwatch
        run: |
          sudo chmod -R a+w .
          docker run --rm --privileged \
            -v "$(pwd):/home/mersdk/project" \
            -w /home/mersdk/project \
            "coderus/sailfishos-platform-sdk-${{ matrix.arch }}:${{ env.SFOS_VERSION }}" \
            /bin/bash -c "
              set -ex
              mb2 -t SailfishOS-${{ env.SFOS_VERSION }}-${{ matrix.arch }} build
              mkdir -p /home/mersdk/project/RPMS
              cp -v RPMS/*.rpm /home/mersdk/project/RPMS/ || true
            "

      - name: Fix permissions and rename RPM
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          sudo chmod -R a+w harbour-gitwatch/RPMS || true
          mkdir -p harbour-gitwatch/dist
          for rpm in harbour-gitwatch/RPMS/*.rpm; do
            if [ -f "$rpm" ]; then
              newname="harbour-gitwatch/dist/harbour-gitwatch-${VERSION}-${{ matrix.arch }}.rpm"
              cp "$rpm" "$newname"
              echo "Copied: $rpm -> $newname"
            fi
          done
          ls -lh harbour-gitwatch/dist/

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: harbour-gitwatch/dist/*.rpm
          retention-days: 90

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-rpms]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y bzip2

      - name: Download all RPMs
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rpm-*
          merge-multiple: true

      - name: Create source tarball
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          cd harbour-gitwatch
          sed -i "s/^VERSION=\".*\"/VERSION=\"${VERSION}\"/" build.sh
          chmod +x build.sh
          ./build.sh
          mkdir -p ../dist
          cp harbour-gitwatch-*.tar.bz2 ../dist/
          cd ..

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          cat > release-notes.md <<EOF
          ## Skoða v${VERSION}

          GitHub Activity Notifier for Sailfish OS (Jolla Phone 2026)

          ### Features
          - Monitor GitHub users for activity (pushes, PRs, issues, releases)
          - Persistent background daemon checks every minute
          - System notifications with Sailfish OS native sound integration
          - Sound only for new releases (configurable)
          - Notification filter for event types
          - Add/remove watched users
          - Danish language UI

          ### Installation
          Download the RPM for your device architecture and install:
          \`\`\`bash
          pkcon install-local harbour-gitwatch-${VERSION}-aarch64.rpm
          \`\`\`

          ### Supported Architectures
          - **aarch64** - Jolla Phone 2026 (Sailfish OS 5.0, 64-bit ARM)
          - **armv7hl** - 32-bit ARM devices (older Jolla phones)
          - **i486** - Sailfish OS Emulator (x86)

          ### Requirements
          - Sailfish OS 5.x
          - pyotherside-qml-plugin-python3-qt5
          - python3-base

          ### Files
          - \`harbour-gitwatch-${VERSION}-aarch64.rpm\` - For Jolla Phone 2026 (ARM64)
          - \`harbour-gitwatch-${VERSION}-armv7hl.rpm\` - For 32-bit ARM devices
          - \`harbour-gitwatch-${VERSION}-i486.rpm\` - For emulator (x86)
          - \`harbour-gitwatch-${VERSION}.tar.bz2\` - Source tarball

          ### License
          GPL-3.0 - see [LICENSE](https://github.com/storefyr/Sko-a/blob/main/LICENSE)
          EOF
          echo "notes-file=release-notes.md" >> $GITHUB_OUTPUT

      - name: List release assets
        run: |
          echo "Release assets:"
          ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-release.outputs.version }}
          name: Skoða v${{ needs.prepare-release.outputs.version }}
          body_path: ${{ steps.notes.outputs.notes-file }}
          files: |
            dist/harbour-gitwatch-*.rpm
            dist/harbour-gitwatch-*.tar.bz2
          draft: false
          prerelease: false
