name: CI

on:
  push:
    branches: [main]
    paths:
      - 'harbour-skodja/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'harbour-skodja/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'harbour-skodja/requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r harbour-skodja/requirements-dev.txt

      - name: Run tests
        working-directory: harbour-skodja
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: harbour-skodja/test-results.xml

      - name: Generate coverage report
        working-directory: harbour-skodja
        run: |
          python -m pytest tests/ --cov=python/gitwatch --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: harbour-skodja/coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'harbour-skodja/requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r harbour-skodja/requirements-dev.txt

      - name: Run flake8
        working-directory: harbour-skodja
        run: |
          flake8 python/ --max-line-length=120 --extend-ignore=E501,W503,E203

      - name: Check black formatting
        working-directory: harbour-skodja
        run: |
          black --check --diff python/ tests/

      - name: Run mypy type check
        working-directory: harbour-skodja
        run: |
          mypy python/ --ignore-missing-imports --no-strict-optional

  validate-packaging:
    name: Validate Packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate RPM spec syntax
        working-directory: harbour-skodja
        run: |
          python3 -c "
          with open('rpm/harbour-skodja.spec') as f:
              content = f.read()
          required = ['Name:', 'Version:', 'Release:', 'Summary:', 'License:', '%description', '%install', '%files']
          for field in required:
              assert field in content, f'Missing required field: {field}'
          print('RPM spec validation passed')
          "

      - name: Check build script
        working-directory: harbour-skodja
        run: |
          bash -n build.sh && echo "build.sh syntax OK"
          test -x build.sh || chmod +x build.sh
          test -x build.sh && echo "build.sh is executable"

      - name: Validate icons
        working-directory: harbour-skodja
        run: |
          for size in 86 108 128 256; do
            icon="icons/harbour-skodja-${size}.png"
            if [ ! -f "$icon" ]; then
              echo "Missing icon: $icon"
              exit 1
            fi
            file "$icon" | grep -q "PNG image data, ${size} x ${size}"
            echo "Icon OK: $icon"
          done

      - name: Validate desktop file
        working-directory: harbour-skodja
        run: |
          test -f harbour-skodja.desktop || { echo "Missing harbour-skodja.desktop"; exit 1; }
          grep -q "^\[Desktop Entry\]" harbour-skodja.desktop
          grep -q "^Name=" harbour-skodja.desktop
          grep -q "^Exec=" harbour-skodja.desktop
          grep -q "^Icon=" harbour-skodja.desktop
          echo "Desktop file OK"

  validate-qml:
    name: Validate QML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pytest
        run: pip install pytest

      - name: Run QML validation tests
        working-directory: harbour-skodja
        run: |
          python -m pytest tests/test_github_client.py::TestQmlSyntax -v

      - name: Check QML files for common issues
        working-directory: harbour-skodja/qml
        run: |
          echo "Checking QML files..."
          for f in $(find . -name "*.qml"); do
            echo "  Checking $f"
            grep -q "import QtQuick" "$f" || { echo "    ERROR: Missing QtQuick import"; exit 1; }
            grep -q "import Sailfish.Silica" "$f" || { echo "    ERROR: Missing Silica import"; exit 1; }
            open=$(grep -o '{' "$f" | wc -l)
            close=$(grep -o '}' "$f" | wc -l)
            if [ "$open" != "$close" ]; then
              echo "    ERROR: Unbalanced braces ($open open, $close close)"
              exit 1
            fi
            open_p=$(grep -o '(' "$f" | wc -l)
            close_p=$(grep -o ')' "$f" | wc -l)
            if [ "$open_p" != "$close_p" ]; then
              echo "    ERROR: Unbalanced parentheses ($open_p open, $close_p close)"
              exit 1
            fi
          done
          echo "All QML files passed validation"

  build-tarball:
    name: Build Source Tarball
    runs-on: ubuntu-latest
    needs: [python-tests, lint, validate-packaging, validate-qml]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y bzip2

      - name: Create source tarball
        working-directory: harbour-skodja
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: harbour-skodja/harbour-skodja-*.tar.bz2

      - name: Verify tarball contents
        run: |
          cd harbour-skodja
          echo "--- Tarball contents ---"
          tar -tjf harbour-skodja-*.tar.bz2 | head -30
          echo "---"
          echo "Tarball contains $(tar -tjf harbour-skodja-*.tar.bz2 | wc -l) files"
          echo ""
          echo "--- Key files check ---"
          tar -tjf harbour-skodja-*.tar.bz2 | grep -q "rpm/harbour-skodja.spec" && echo "✓ spec file present"
          tar -tjf harbour-skodja-*.tar.bz2 | grep -q "harbour-skodja.pro" && echo "✓ pro file present"
          tar -tjf harbour-skodja-*.tar.bz2 | grep -q "harbour-skodja.desktop" && echo "✓ desktop file present"
          tar -tjf harbour-skodja-*.tar.bz2 | grep -q "qml/harbour-skodja.qml" && echo "✓ QML main file present"
          tar -tjf harbour-skodja-*.tar.bz2 | grep -q "python/gitwatch/__init__.py" && echo "✓ Python module present"
          tar -tjf harbour-skodja-*.tar.bz2 | grep -q "icons/harbour-skodja-86.png" && echo "✓ icons present"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [python-tests, lint, validate-packaging, validate-qml, build-tarball]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Tests | ${{ needs.python-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validate Packaging | ${{ needs.validate-packaging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validate QML | ${{ needs.validate-qml.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Tarball | ${{ needs.build-tarball.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.python-tests.result }}" == "success" ] && \
             [ "${{ needs.lint.result }}" == "success" ] && \
             [ "${{ needs.validate-packaging.result }}" == "success" ] && \
             [ "${{ needs.validate-qml.result }}" == "success" ] && \
             [ "${{ needs.build-tarball.result }}" == "success" ]; then
            echo "✅ All checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some checks failed. See job logs for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
