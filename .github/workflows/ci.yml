name: CI

on:
  push:
    branches: [main]
    paths:
      - 'harbour-gitwatch/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'harbour-gitwatch/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  SFOS_RELEASE: '5.0.0.76'
  SFOS_ARCH: 'aarch64'

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'harbour-gitwatch/requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r harbour-gitwatch/requirements-dev.txt

      - name: Run tests
        working-directory: harbour-gitwatch
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: harbour-gitwatch/test-results.xml

      - name: Generate coverage report
        working-directory: harbour-gitwatch
        run: |
          python -m pytest tests/ --cov=python/gitwatch --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: harbour-gitwatch/coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'harbour-gitwatch/requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r harbour-gitwatch/requirements-dev.txt

      - name: Run flake8
        working-directory: harbour-gitwatch
        run: |
          flake8 python/ tests/ --max-line-length=120 --extend-ignore=E501,W503,E203

      - name: Check black formatting
        working-directory: harbour-gitwatch
        run: |
          black --check --diff python/ tests/

      - name: Run mypy type check
        working-directory: harbour-gitwatch
        run: |
          mypy python/ --ignore-missing-imports --no-strict-optional || true

  validate-packaging:
    name: Validate Packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate RPM spec syntax
        working-directory: harbour-gitwatch
        run: |
          python3 << 'EOF'
          with open('rpm/harbour-gitwatch.spec') as f:
              content = f.read()
          required = ['Name:', 'Version:', 'Release:', 'Summary:', 'License:', '%description', '%install', '%files']
          for field in required:
              assert field in content, f'Missing required field: {field}'
          assert 'BuildArch: noarch' in content, 'Missing BuildArch: noarch'
          print('RPM spec validation passed')
          EOF

      - name: Validate YAML manifest
        working-directory: harbour-gitwatch
        run: |
          pip install pyyaml
          python3 << 'EOF'
          import yaml
          with open('rpm/harbour-gitwatch.yaml') as f:
              data = yaml.safe_load(f)
          required = ['Name', 'Summary', 'Version', 'Release', 'License']
          for field in required:
              assert field in data, f'Missing required field: {field}'
          print('YAML manifest validation passed')
          print(f'Package: {data["Name"]} v{data["Version"]}-{data["Release"]}')
          EOF

      - name: Check build script
        working-directory: harbour-gitwatch
        run: |
          bash -n build.sh && echo "build.sh syntax OK"
          test -x build.sh && echo "build.sh is executable"

      - name: Validate icons
        working-directory: harbour-gitwatch
        run: |
          for size in 86 108 128 256; do
            icon="icons/harbour-gitwatch-${size}.png"
            if [ ! -f "$icon" ]; then
              echo "Missing icon: $icon"
              exit 1
            fi
            file "$icon" | grep -q "PNG image data, ${size} x ${size}"
            echo "Icon OK: $icon"
          done

  validate-qml:
    name: Validate QML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pytest
        run: pip install pytest

      - name: Run QML validation tests
        working-directory: harbour-gitwatch
        run: |
          python -m pytest tests/test_github_client.py::TestQmlSyntax -v

      - name: Check QML files for common issues
        working-directory: harbour-gitwatch/qml
        run: |
          echo "Checking QML files..."
          for f in $(find . -name "*.qml"); do
            echo "  Checking $f"
            grep -q "import QtQuick" "$f" || { echo "    ERROR: Missing QtQuick import"; exit 1; }
            grep -q "import Sailfish.Silica" "$f" || { echo "    ERROR: Missing Silica import"; exit 1; }
            open=$(grep -o '{' "$f" | wc -l)
            close=$(grep -o '}' "$f" | wc -l)
            if [ "$open" != "$close" ]; then
              echo "    ERROR: Unbalanced braces ($open open, $close close)"
              exit 1
            fi
            open_p=$(grep -o '(' "$f" | wc -l)
            close_p=$(grep -o ')' "$f" | wc -l)
            if [ "$open_p" != "$close_p" ]; then
              echo "    ERROR: Unbalanced parentheses ($open_p open, $close_p close)"
              exit 1
            fi
          done
          echo "All QML files passed validation"

  build-rpm:
    name: Build RPM (${{ env.SFOS_ARCH }})
    runs-on: ubuntu-latest
    needs: [python-tests, lint, validate-packaging, validate-qml]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build RPM with Sailfish OS SDK
        uses: R1tschY/sailfish-build-rpm@v1
        with:
          release: ${{ env.SFOS_RELEASE }}
          arch: ${{ env.SFOS_ARCH }}
          source-dir: harbour-gitwatch
          fix-version: false

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbour-gitwatch-${{ env.SFOS_ARCH }}-rpm
          path: RPMS/*.rpm
          retention-days: 30

      - name: Verify RPM package
        run: |
          echo "Built RPM packages:"
          ls -lh RPMS/*.rpm
          echo ""
          echo "RPM info:"
          rpm -qip RPMS/*.rpm 2>/dev/null || echo "RPM tools not available"

  build-rpm-multiarch:
    name: Build RPM (all archs)
    runs-on: ubuntu-latest
    needs: [python-tests, lint, validate-packaging, validate-qml]
    strategy:
      matrix:
        arch: [aarch64, armv7hl, i486]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build RPM for ${{ matrix.arch }}
        uses: R1tschY/sailfish-build-rpm@v1
        with:
          release: ${{ env.SFOS_RELEASE }}
          arch: ${{ matrix.arch }}
          source-dir: harbour-gitwatch
          fix-version: false

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbour-gitwatch-${{ matrix.arch }}-rpm
          path: RPMS/*.rpm
          retention-days: 30

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [python-tests, lint, validate-packaging, validate-qml, build-rpm]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Tests | ${{ needs.python-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validate Packaging | ${{ needs.validate-packaging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validate QML | ${{ needs.validate-qml.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build RPM (aarch64) | ${{ needs.build-rpm.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- RPM package for Sailfish OS ${{ env.SFOS_ARCH }} (Jolla Phone 2026)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.python-tests.result }}" == "success" ] && \
             [ "${{ needs.lint.result }}" == "success" ] && \
             [ "${{ needs.validate-packaging.result }}" == "success" ] && \
             [ "${{ needs.validate-qml.result }}" == "success" ] && \
             [ "${{ needs.build-rpm.result }}" == "success" ]; then
            echo "✅ All checks passed! RPM ready for installation." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some checks failed. See job logs for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
