[flake8]
max-line-length = 120
extend-ignore = E501,W503,E203
exclude =
    __pycache__,
    .git,
    *.pyc

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

[mypy]
python_version = 3.9
ignore_missing_imports = True
no_strict_optional = True
warn_return_any = False
warn_unused_configs = True

[coverage:run]
source = python/gitwatch
omit =
    */tests/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
